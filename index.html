<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curriculum vitae of Stefano Grancini">
  <title>Curriculum Vitae — Stefano Grancini</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5f6878;
      --accent: #174b7a;
      --accent-hover: #0f385e;
      --paper: #ffffff;
      --background: #f4f6f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      color: var(--ink);
      background: var(--background);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 46rem);
      padding: clamp(2rem, 6vw, 4.5rem);
      background: var(--paper);
      border: 1px solid #e1e5ea;
      box-shadow: 0 1.25rem 3.5rem rgba(23, 32, 51, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .affiliation,
    .updated {
      margin: 0.2rem 0;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .cv-link {
      display: inline-block;
      margin: 2.25rem 0 1.4rem;
      padding: 0.9rem 1.35rem;
      color: #ffffff;
      background: var(--accent);
      border-radius: 0.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      text-decoration: none;
      transition: background 120ms ease-in-out;
    }

    .cv-link:hover,
    .cv-link:focus-visible {
      background: var(--accent-hover);
    }

    .cv-link:focus-visible {
      outline: 3px solid rgba(23, 75, 122, 0.3);
      outline-offset: 3px;
    }

    .updated {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stefano Grancini</h1>
    <p class="affiliation">Curriculum Vitae</p>
    <p class="affiliation">Nova School of Business and Economics</p>
    <a class="cv-link" href="cv.pdf">Latest version — PDF</a>
    <p class="updated">Last updated: <time datetime="2026-09-28">2026-09-28</time></p>
  </main>
</body>
</html>
